# Local development stack. All credentials below are placeholders for a
# throwaway local Postgres + dev JWT secret - override every one of them
# (env vars or a docker-compose.override.yml) before deploying anywhere real.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meishi
      POSTGRES_USER: meishi
      POSTGRES_PASSWORD: meishi
    ports:
      - "5432:5432"
    volumes:
      - meishi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meishi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  meishi-pgdata:
