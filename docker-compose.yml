# Local development stack. All credentials below are placeholders for a
# throwaway local Postgres + dev JWT secret - override every one of them
# (env vars or a docker-compose.override.yml) before deploying anywhere real.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meishi
      POSTGRES_USER: meishi
      POSTGRES_PASSWORD: meishi
    volumes:
      - meishi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meishi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: meishi
      DB_USER: meishi
      DB_PASSWORD: meishi
      JWT_SECRET: change-me-in-production
      ADMIN_NICKNAME: admin
      ADMIN_PASSWORD: change-me
      HTTP_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  meishi-pgdata:
