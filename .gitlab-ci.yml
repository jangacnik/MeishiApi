# `test` runs automatically on every commit, every branch. `build` and
# `deploy-production` run automatically too, but only on the default branch
# (deploy-dev stays a manual job - dev deploys are still deliberate). Every
# job is interruptible and the project has "auto-cancel redundant pipelines"
# on, so pushing again while a pipeline is still running cancels the older
# one instead of racing it to prod.

stages:
  - test
  - build
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG-gradle"
  paths:
    - .gradle/wrapper
    - .gradle/caches

test:
  stage: test
  retry: 2
  image: gradle:9.3.0-jdk21
  interruptible: true
  script:
    - gradle --no-daemon test
  artifacts:
    when: always
    paths:
      - build/reports/tests
    reports:
      junit:
        - build/test-results/test/**/TEST-*.xml

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --cache=true

.deploy_base:
  stage: deploy
  image: alpine/k8s:1.31.13
  interruptible: true
  script:
    - |
      cat > /tmp/kubeconfig.yaml <<EOF
      apiVersion: v1
      kind: Config
      clusters:
        - name: prod
          cluster:
            server: ${K8S_API_SERVER}
            certificate-authority-data: ${K8S_CA_CERT_B64}
      contexts:
        - name: deployer
          context:
            cluster: prod
            namespace: ${K8S_NAMESPACE}
            user: deployer
      current-context: deployer
      users:
        - name: deployer
          user:
            token: ${K8S_TOKEN}
      EOF
    - export KUBECONFIG=/tmp/kubeconfig.yaml
    - sed "s|__IMAGE__|$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA|g" deploy/k8s/deployment.yaml > /tmp/deployment.yaml
    - kubectl apply --validate=false -n "$K8S_NAMESPACE" -f /tmp/deployment.yaml
    - kubectl apply --validate=false -n "$K8S_NAMESPACE" -f deploy/k8s/service.yaml
    - kubectl -n "$K8S_NAMESPACE" rollout status deployment/meishi-api --timeout=180s
  # deploy/k8s/rbac.yaml is intentionally never applied here - the CI job's
  # own identity can't grant itself the RBAC it needs before it has any.
  # Apply that one yourself, once: kubectl apply -f deploy/k8s/rbac.yaml

deploy-dev:
  extends: .deploy_base
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  environment: dev
  variables:
    K8S_NAMESPACE: dev

deploy-production:
  extends: .deploy_base
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment: production
  variables:
    K8S_NAMESPACE: default
