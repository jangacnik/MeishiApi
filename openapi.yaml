openapi: 3.0.3
info:
  title: MeishiApi
  version: 1.0.0
  description: Every operation that takes a body can also return 413 when the body exceeds 16 KiB. Errors are {"error": message}.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Token:
      type: object
      required: [token]
      properties:
        token: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string, nullable: true }
        role: { type: string, enum: [USER, ADMIN] }
        status: { type: string, enum: [ACTIVE, FROZEN] }
        activated: { type: boolean }
        createdAt: { type: string, format: date-time }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        addressLine1: { type: string, nullable: true }
        addressLine2: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        avatarKey: { type: string, nullable: true }
        deletionRequestedAt: { type: string, format: date-time, nullable: true }
    ProfileFields:
      type: object
      description: Any subset of the profile strings; wrong types are rejected with 400.
      properties:
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        addressLine1: { type: string, nullable: true }
        addressLine2: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        avatarKey: { type: string, nullable: true }
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid or malformed input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing, invalid, or stale token (including frozen or deleted user)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Admin role required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Unknown user or route
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflict (nickname taken, invalid activation key)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooLarge:
      description: Body larger than 16 KiB
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
paths:
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200': { description: Process is up }
  /health/ready:
    get:
      summary: Readiness probe (runs SELECT 1)
      responses:
        '200': { description: Database reachable }
        '503': { description: Database unreachable }
  /api/auth/register:
    post:
      summary: Activate an account with an activation key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activationKey, nickname, password]
              properties:
                activationKey: { type: string, format: uuid }
                nickname: { type: string }
                password: { type: string }
      responses:
        '200': { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/auth/login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, password]
              properties:
                nickname: { type: string }
                password: { type: string }
      responses:
        '200': { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Account frozen after repeated failures }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/oauth/client:
    get:
      summary: Check that a client and URI are registered before starting a hosted flow
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: false, schema: { type: string } }
        - { name: return_uri, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Registered client
          content:
            application/json:
              schema:
                type: object
                required: [clientId, name]
                properties:
                  clientId: { type: string }
                  name: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/oauth/authorize:
    post:
      summary: Issue a single-use authorization code for the logged-in user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_type, client_id, redirect_uri, state, code_challenge, code_challenge_method]
              properties:
                response_type: { type: string, enum: [code] }
                client_id: { type: string }
                redirect_uri: { type: string }
                state: { type: string, minLength: 1, maxLength: 512 }
                code_challenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                code_challenge_method: { type: string, enum: [S256] }
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/oauth/token:
    post:
      summary: Exchange an authorization code for a Meishi JWT
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, redirect_uri, client_id, code_verifier]
              properties:
                grant_type: { type: string, enum: [authorization_code] }
                code: { type: string }
                redirect_uri: { type: string }
                client_id: { type: string }
                code_verifier: { type: string }
      responses:
        '200':
          description: Token, sent with Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer, description: Seconds left of the authorizing session }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/users/me:
    get:
      summary: Own record
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Own user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update own profile fields
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileFields' } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/me/nickname:
    patch:
      summary: Change own nickname
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/users/me/password:
    patch:
      summary: Change own password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/me/request-deletion:
    post:
      summary: Mark own account for admin-reviewed deletion
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Withdraw a pending deletion request
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/nicknames:
    get:
      summary: Directory of activated users (id and nickname only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    nickname: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users:
    get:
      summary: List all users (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All users
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create an unactivated user and activation key (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [USER, ADMIN], default: USER }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  activationKey: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/users/{id}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    patch:
      summary: Change role (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [USER, ADMIN] }
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a user (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/users/{id}/status:
    patch:
      summary: Freeze or unfreeze a user (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, FROZEN] }
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/users/{id}/profile:
    patch:
      summary: Update a user's nickname and profile fields (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProfileFields'
                - type: object
                  properties:
                    nickname: { type: string }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/users/{id}/password:
    patch:
      summary: Set a user's password (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string }
      responses:
        '204': { description: Password set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
