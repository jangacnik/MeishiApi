name: ci
on:
  push:
    branches: ['**']
env:
  REGISTRY: gitea.gacnikhome.duckdns.org
  IMAGE: gitea.gacnikhome.duckdns.org/tcg/meishiapi
jobs:
  test:
    runs-on: host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: |
          NET="ci-$GITHUB_RUN_ID-$GITHUB_RUN_NUMBER"
          docker network create "$NET"
          trap 'docker rm -f "$NET-db" >/dev/null 2>&1; docker network rm "$NET" >/dev/null 2>&1' EXIT
          docker run -d --name "$NET-db" --network "$NET" -e POSTGRES_DB=meishi_test -e POSTGRES_USER=meishi -e POSTGRES_PASSWORD=meishi --health-cmd "pg_isready -U meishi" --health-interval 2s --health-retries 30 postgres:16
          until [ "$(docker inspect -f '{{.State.Health.Status}}' "$NET-db")" = healthy ]; do sleep 2; done
          docker run --rm --network "$NET" -e CI=true -e TEST_DB_URL="jdbc:postgresql://$NET-db:5432/meishi_test" --user "$(id -u):$(id -g)" -e HOME=/tmp -e GRADLE_USER_HOME=/tmp/gradle -v "$PWD":/w -w /w gradle:9.3.0-jdk21 gradle --no-daemon test koverXmlReport koverHtmlReport koverVerify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-${{ github.run_number }}
          path: build/reports/kover
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep only the 3 newest coverage reports
        if: always()
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          API: https://gitea.gacnikhome.duckdns.org/api/v1/repos/${{ github.repository }}/actions/artifacts
        run: |
          python3 - <<'EOF' || true
          import json, os, urllib.request
          def call(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "token " + os.environ["CI_TOKEN"]})
              with urllib.request.urlopen(req) as r:
                  return json.load(r) if method == "GET" else None
          api = os.environ["API"]
          reports = [a for a in call(api + "?limit=100")["artifacts"] if a["name"].startswith("coverage-")]
          newest_first = sorted({a["name"]: a["id"] for a in sorted(reports, key=lambda a: a["id"])}.items(), key=lambda kv: kv[1], reverse=True)
          stale = {name for name, _ in newest_first[3:]}
          for a in reports:
              if a["name"] in stale:
                  call(api + "/" + str(a["id"]), "DELETE")
          EOF
      - name: Enforce 80% coverage on changed lines
        run: |
          git fetch -q origin master
          git diff origin/master...HEAD > pr.diff
          docker run --rm -v "$PWD":/w -w /w python:3.13-alpine sh -c "pip install -q diff-cover && diff-cover build/reports/kover/report.xml --diff-file pr.diff --fail-under=80"
  build:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        run: |
          echo "${{ secrets.CI_TOKEN }}" | docker login "$REGISTRY" -u ci-bot --password-stdin
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          docker build -f Dockerfile -t "$IMAGE:$TAG" .
          for i in 1 2 3; do
            docker run --rm --tmpfs /tmp:size=4g -v trivy-cache:/root/.cache -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE:$TAG" && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          docker push "$IMAGE:$TAG"
      - name: Keep only the 5 newest local images
        run: |
          docker images "$IMAGE" --format '{{.ID}}' | awk '!seen[$0]++' | tail -n +6 | xargs -r docker rmi -f || true
          docker image prune -f
      - name: Bump image tag in homelab-gitops
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          rm -rf gitops
          AUTH=$(printf 'ci-bot:%s' "${{ secrets.CI_TOKEN }}" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic $AUTH" clone https://gitea.gacnikhome.duckdns.org/tcg/homelab-gitops.git gitops
          cd gitops
          sed -i "s/newTag:.*/newTag: $TAG/" apps/meishi-api/kustomization.yaml
          git -c user.name=ci-bot -c user.email=ci-bot@gacnikhome.duckdns.org commit -qam "meishi-api: $TAG"
          for i in 1 2 3 4 5; do git -c "http.extraheader=Authorization: Basic $AUTH" pull --rebase -q && git -c "http.extraheader=Authorization: Basic $AUTH" push -q && break; sleep 3; done
