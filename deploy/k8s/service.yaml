# NodePort - reachable on the LAN at http://<any-k8s-node-ip>:30081/...
apiVersion: v1
kind: Service
metadata:
  name: meishi-api
  labels:
    app: meishi-api
spec:
  type: NodePort
  selector:
    app: meishi-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
