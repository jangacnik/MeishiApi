# NOT applied by CI - the ci_job identity can't grant itself RBAC before it
# has any. Apply this yourself, once, with a kubeconfig that already has
# cluster access:
#   kubectl apply -f deploy/k8s/rbac.yaml
#
# Grants the GitLab agent's per-job identity (group "gitlab:ci_job:<project
# path>", per the access_as: ci_job: {} in the tcg-accumulator project's
# .gitlab/agents/prod-agent/config.yaml, which must list this project under
# ci_access.projects) exactly the permissions the deploy job in
# .gitlab-ci.yml needs, in the `default` namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meishi-api-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meishi-api-deployer-binding
  namespace: default
subjects:
  - kind: Group
    name: "gitlab:ci_job:tcg/MeishiApi"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: meishi-api-deployer
  apiGroup: rbac.authorization.k8s.io
