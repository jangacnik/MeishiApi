# __IMAGE__ is substituted at deploy time with the image built by CI (see .gitea/workflows/ci.yaml).
#
# Needs, created once out of band (not by CI):
#   kubectl create secret generic meishi-api-secrets \
#     --from-literal=db-host='...' \
#     --from-literal=db-port='5432' \
#     --from-literal=db-name='meishi' \
#     --from-literal=db-user='...' \
#     --from-literal=db-password='...' \
#     --from-literal=jwt-secret='...' \
#     --from-literal=admin-nickname='...' \
#     --from-literal=admin-password='...'
#
# Optional keys in the same secret (the app falls back to defaults when absent):
#   db-ssl-mode          disable (default) | allow | prefer | require | verify-ca | verify-full
#   db-migration-user    separate role that owns the schema (DDL); db-user then only needs DML
#   db-migration-password
#
# Also needs a "regcred" docker-registry secret so the cluster can pull the
# image (the registry doesn't allow anonymous pulls) - a Gitea access token
# with read:package scope works:
#   kubectl create secret docker-registry regcred \
#     --docker-server=<registry host:port> \
#     --docker-username=<deploy token username> \
#     --docker-password=<deploy token>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meishi-api
  labels:
    app: meishi-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meishi-api
  template:
    metadata:
      labels:
        app: meishi-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: regcred
      containers:
        - name: app
          image: __IMAGE__
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: db-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: db-port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: db-password
            - name: DB_SSL_MODE
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: db-ssl-mode
                  optional: true
            - name: DB_MIGRATION_USER
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: db-migration-user
                  optional: true
            - name: DB_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: db-migration-password
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: jwt-secret
            - name: ADMIN_NICKNAME
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: admin-nickname
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meishi-api-secrets
                  key: admin-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
